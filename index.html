<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOPAMINE.F | ROYAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;500;700&family=Cairo:wght@300;600&display=swap');
        :root { --accent: #b8924a; --bg: #ffffff; --text: #1a1a1a; }
        * { box-sizing: border-box; transition: 0.3s ease; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; overflow-x: hidden; padding-bottom: 40px; }
        h1, h2, h3, .section-title, .logo { font-family: 'Playfair Display', serif; }
        html[dir="rtl"] body { font-family: 'Cairo', sans-serif; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 6%; background: #fff; position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid #f8f8f8; }
        .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
        .nav-icons { display: flex; gap: 20px; align-items: center; }

        .lang-btn { 
            cursor: pointer; background: #f8f8f8; border: 1px solid #eee; padding: 6px 14px; 
            font-size: 0.7rem; font-weight: 600; border-radius: 20px; display: flex; align-items: center; gap: 5px; color: #1a1a1a;
        }

        .hero { height: 55vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        #heroImg { position: absolute; inset: 0; background-position: center; background-repeat: no-repeat; background-size: cover; filter: grayscale(20%) brightness(0.5); }
        .hero h1 { position: relative; color: #fff; font-size: 3rem; letter-spacing: 6px; margin: 0; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .section-title { padding: 60px 6% 30px; font-size: 1.8rem; text-align: center; text-transform: uppercase; letter-spacing: 4px; color: var(--text); font-weight: 700; }
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; padding: 20px 6% 80px; }
        .card { cursor: pointer; border-radius: 4px; overflow: hidden; }
        .card img { width: 100%; aspect-ratio: 0.85; object-fit: cover; }
        .card-info { padding: 15px 0; text-align: center; }
        .card-info b { display: block; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; margin-bottom: 5px; }
        .card-info span, #detPrice, #totalPrice { color: var(--accent); font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.1rem; }

        #bigModal { position: fixed; top: 100%; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; transition: 0.4s; overflow-y: auto; }
        .drawer { position: fixed; top: 0; width: 100%; max-width: 420px; height: 100%; background: #fff; z-index: 5000; padding: 40px 30px; transition: 0.5s; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.05); }
        #cartDrawer { right: -100%; } #cartDrawer.active { right: 0; }
        #adminDrawer { left: -100%; } #adminDrawer.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 4000; display: none; backdrop-filter: blur(3px); }

        input, select { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #eee; outline: none; font-family: inherit; font-size: 0.95rem; border-radius: 4px; }
        .add-btn { width: 100%; padding: 20px; background: #1a1a1a; color: #fff; border: none; cursor: pointer; font-weight: 600; letter-spacing: 1px; font-size: 1rem; border-radius: 4px; }
        
        .inv-row { display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .inv-controls { display: flex; gap: 10px; align-items: center; }
        .inv-select { padding: 5px; margin: 0; font-size: 0.75rem; width: auto; flex: 1; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .cart-item-info { flex: 1; }
        .cart-item-info b { font-size: 0.85rem; display: block; }
        .cart-item-info span { font-size: 0.75rem; color: var(--accent); }
        .remove-cart-btn { color: #ff4d4d; cursor: pointer; padding: 5px; font-size: 0.9rem; }

        .qty-box { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: #f9f9f9; padding: 10px; border-radius: 4px; }
        .qty-btn { cursor: pointer; width: 35px; height: 35px; border-radius: 50%; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; background: #fff; }
        #qtyValue { font-weight: 700; font-size: 1.1rem; min-width: 30px; }

        .admin-order-card { background: #fff; padding: 15px; margin-bottom: 10px; border: 2px solid #eee; border-radius: 8px; font-size: 1.1rem; line-height: 1.6; color: #000; }
        .admin-order-card b { color: var(--accent); font-size: 1.2rem; }
        .order-done-btn { background: #22c55e; color: #fff; border: none; padding: 10px 20px; margin-top: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        
        .cat-tag { background: #eee; padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; }
        .cat-tag i { color: #ff4d4d; cursor: pointer; }
    </style>
</head>
<body>

    <nav>
        <div onclick="checkAdmin()"><i class="fa-solid fa-crown" style="font-size: 0.9rem; color: #000; cursor: pointer;"></i></div>
        <div class="logo">DOPAMINE.F</div>
        <div class="nav-icons">
            <div class="lang-btn" onclick="toggleLanguage()">
                <i class="fa-solid fa-globe"></i>
                <span id="langText">العربية</span>
            </div>
            <div onclick="toggleCart()" style="position:relative; cursor: pointer;">
                <i class="fa-solid fa-bag-shopping" style="font-size: 1.2rem;"></i>
                <span id="badge" style="position:absolute; top:-5px; right:-5px; background:var(--accent); color:#fff; font-size:0.65rem; width:18px; height:18px; border-radius:50%; display:none; text-align:center; line-height:18px;">0</span>
            </div>
        </div>
    </nav>

    <div id="mainView">
        <div class="hero">
            <div id="heroImg"></div>
            <h1 id="txt-hero">DOPAMINE</h1>
        </div>
        <div id="sectionsDisplay"></div>
        <div id="myIdDisplay" style="text-align:center; font-size:0.6rem; color:#ccc; margin-top:20px;"></div>
    </div>

    <div id="bigModal">
        <div style="padding: 15px 6%; display: flex; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 10; border-bottom: 1px solid #f8f8f8;">
            <i class="fa-solid fa-chevron-left" onclick="closeDetail()" style="cursor: pointer;"></i>
            <span style="font-size: 0.65rem; letter-spacing: 2px; font-weight: 600;">DETAILS</span>
            <i class="fa-solid fa-xmark" onclick="closeDetail()" style="cursor: pointer;"></i>
        </div>
        <div style="padding: 10px 8% 40px; text-align: center;">
            <img id="detImg" style="width: 100%; max-width: 400px; border-radius: 4px;">
            <h2 id="detName" style="margin: 20px 0 5px;"></h2>
            <div id="detPrice"></div>
            <p id="detSim" style="color: #666; font-size: 0.9rem; line-height: 1.5; margin-bottom: 25px;"></p>
            
            <div class="qty-box">
                <div class="qty-btn" onclick="changeQty(-1)"><i class="fa-solid fa-minus"></i></div>
                <div id="qtyValue">1</div>
                <div class="qty-btn" onclick="changeQty(1)"><i class="fa-solid fa-plus"></i></div>
            </div>

            <button id="addMainBtn" class="add-btn">ADD TO BAG</button>
        </div>
    </div>

    <div id="adminDrawer" class="drawer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h2 style="margin:0;">MANAGER</h2>
            <i class="fa-solid fa-xmark" onclick="closeAll()" style="cursor: pointer;"></i>
        </div>
        
        <div style="background: #e0f2f1; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #4db6ac;">
            <h4>قائمة المسؤولين (Admins)</h4>
            <div id="activeAdminsList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <div style="background: #fff3e0; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ffcc80;">
            <h4>إضافة كود خصم</h4>
            <input id="promoCode" placeholder="كود الخصم (مثال: SALE20)">
            <input id="promoPercent" type="number" placeholder="نسبة الخصم %">
            <input id="promoMax" type="number" placeholder="أقصى مبلغ للخصم">
            <input id="promoMin" type="number" placeholder="الحد الأدنى للطلب">
            <button onclick="addPromoCode()" class="add-btn" style="padding:10px; font-size:0.8rem; background:#e65100;">إنشاء الكود</button>
        </div>

        <div style="background: #eef2ff; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #d1d5db;">
            <h4>إضافة مسؤول جديد</h4>
            <input id="adminNewID" placeholder="أدخل ID المستخدم لجعله أدمن">
            <button onclick="makeNewAdmin()" class="add-btn" style="padding:10px; font-size:0.8rem; background:#4f46e5;">تعيين كأدمن</button>
        </div>

        <div style="background: #f1f1f1; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <h4>البانر</h4>
            <input id="newBanner" placeholder="رابط صورة البانر">
            <button onclick="updateBanner()" class="add-btn" style="padding:10px; font-size:0.8rem;">تحديث</button>
        </div>

        <div style="background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <h4>الأقسام</h4>
            <div id="adminCats" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;"></div>
            <input id="newSecName" placeholder="اسم القسم الجديد">
            <button onclick="addNewSection()" class="add-btn" style="padding:10px; font-size:0.8rem;">إضافة قسم</button>
        </div>

        <div style="background: #fcfcfc; padding: 15px; border: 1px solid #eee; margin-bottom: 20px;">
            <h4>إضافة منتج</h4>
            <input id="pName" placeholder="الأسم"><input id="pSim" placeholder="التفاصيل"><input id="pPrice" placeholder="السعر"><input id="pImg" placeholder="الصورة">
            <select id="pCat"></select>
            <button onclick="addProduct()" class="add-btn" style="padding:10px;">نشر المنتج</button>
        </div>
        
        <h3>الطلبات الجديدة</h3>
        <div id="adminOrders" style="max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding: 5px; background: #f5f5f5;"></div>
        
        <h3>المخزون</h3>
        <div id="adminInventory"></div>
    </div>

    <div id="cartDrawer" class="drawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 id="txt-cart-title" style="margin:0;">MY BAG</h2>
            <i class="fa-solid fa-xmark" onclick="closeAll()" style="cursor: pointer;"></i>
        </div>
        <div id="cartItems"></div>
        <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 25px;">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input id="promoInput" placeholder="Promo Code" style="margin-bottom:0; flex:1;">
                <button onclick="applyPromo()" class="add-btn" style="width:auto; padding:0 15px; font-size:0.8rem;">APPLY</button>
            </div>
            <div id="discountRow" style="display: none; justify-content: space-between; margin-bottom: 10px; color: #ff4d4d; font-weight: bold;">
                <span>DISCOUNT</span><span id="discountPrice">-0 EGP</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 25px;">
                <span>TOTAL</span><span id="totalPrice">0 EGP</span>
            </div>
            <input id="uName" placeholder="Name"><input id="uPhone" placeholder="WhatsApp"><input id="uAddr" placeholder="Address">
            <button onclick="checkout()" class="add-btn">PLACE ORDER</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <script>
        const conf = { apiKey: "AIzaSyBlSFh7cRFWz9RsSfPoo9YwpIxeQaazRuQ", databaseURL: "https://perf-4cd3d-default-rtdb.firebaseio.com" };
        firebase.initializeApp(conf); const db = firebase.database();
        
        // المعرف الأساسي
        const PRIMARY_ADMIN = "DF-95829";

        // توليد ID للعملاء
        let myId = localStorage.getItem('v_id');
        if(!myId) {
            myId = "DF-" + Math.floor(Math.random()*90000 + 10000);
            localStorage.setItem('v_id', myId);
        }
        document.getElementById('myIdDisplay').innerText = "YOUR ID: " + myId;

        let allProducts = [], cart = {}, categories = ["men", "women"], currentLang = 'en', admins = [PRIMARY_ADMIN];
        let promoCodes = {}, cartSubTotal = 0, activePromo = null, currentQty = 1; 

        function load() {
            db.ref().on('value', snapshot => {
                const data = snapshot.val() || {};
                if(data.banner) document.getElementById('heroImg').style.backgroundImage = `url('${data.banner}')`;
                
                if(data.admins) admins = Object.values(data.admins); 
                if(!admins.includes(PRIMARY_ADMIN)) admins.push(PRIMARY_ADMIN);
                
                renderAdminsList();

                if(data.categories) categories = Object.values(data.categories).filter(c => typeof c === 'string');
                if(data.promos) promoCodes = data.promos;
                
                allProducts = [];
                if(data.products) { for(let key in data.products) { allProducts.push({id:key, ...data.products[key]}); } }
                
                renderStore(); 
                renderInventory(); 
                renderOrders(data.orders); 
                updateAdminSelect(); 
                renderAdminCategories();
            });
        }

        // --- التعديل هنا فقط لعرض المنتجات داخل الطلب ---
        function renderOrders(ordersData) {
            const list = document.getElementById('adminOrders');
            if(!list) return;
            list.innerHTML = '';
            
            if(!ordersData) {
                list.innerHTML = '<p style="text-align:center; color:#666;">لا توجد طلبات جديدة</p>';
                return;
            }

            for(let key in ordersData) {
                const o = ordersData[key];
                if(o.status === 'pending') {
                    
                    // جلب وتجهيز قائمة المنتجات المطلوبة
                    let itemsListHtml = '<div style="margin: 10px 0; padding: 10px; background: #f9f9f9; border-radius: 4px; font-size: 0.9rem;"><b>المنتجات:</b><br>';
                    if(o.items) {
                        for(let itemId in o.items) {
                            const item = o.items[itemId];
                            itemsListHtml += `- ${item.n} (الكمية: ${item.q})<br>`;
                        }
                    }
                    itemsListHtml += '</div>';

                    // إضافة بطاقة الطلب متضمنة المنتجات
                    list.innerHTML += `
                        <div class="admin-order-card">
                            <div><b>الاسم:</b> ${o.u}</div>
                            <div><b>الواتساب:</b> ${o.ph}</div>
                            <div><b>العنوان:</b> ${o.ad}</div>
                            ${itemsListHtml}
                            <div><b>الإجمالي:</b> ${o.total}</div>
                            <button class="order-done-btn" onclick="db.ref('orders/${key}').update({status:'done'})">تم التوصيل (DONE)</button>
                        </div>`;
                }
            }
        }

        // باقي الدوال (بدون أي تغيير نهائياً)
        function checkout() {
            const u = document.getElementById('uName').value.trim();
            const ph = document.getElementById('uPhone').value.trim();
            const ad = document.getElementById('uAddr').value.trim();
            
            if(!u || !ph || !ad) {
                return Swal.fire('Error', 'يرجى إكمال جميع البيانات (الاسم، الواتساب، العنوان)', 'error');
            }
            
            db.ref('orders').push({ 
                u: u, 
                ph: ph, 
                ad: ad, 
                items: cart, 
                total: document.getElementById('totalPrice').innerText, 
                status: 'pending' 
            }).then(() => {
                cart = {}; 
                activePromo = null; 
                document.getElementById('promoInput').value = ''; 
                updateCartUI(); 
                closeAll(); 
                Swal.fire('Success', 'تم إرسال طلبك بنجاح', 'success');
            });
        }

        function renderAdminsList() {
            const container = document.getElementById('activeAdminsList');
            if(!container) return;
            container.innerHTML = '';
            admins.forEach(id => {
                const isPermanent = (id === PRIMARY_ADMIN);
                container.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:8px 12px; border-radius:4px; font-size:0.85rem; margin-bottom:5px;">
                    <span><i class="fa-solid fa-user-shield" style="margin-left:8px; color:#4db6ac;"></i> ${id}</span>
                    ${!isPermanent ? `<i class="fa-solid fa-trash" style="color:#ff4d4d; cursor:pointer;" onclick="removeAdmin('${id}')"></i>` : `<span style="font-size:0.6rem; color:#999;">أساسي</span>`}
                </div>`;
            });
        }

        function removeAdmin(idToRemove) {
            Swal.fire({ title: 'سحب الصلاحية؟', text: `حذف ${idToRemove} من المسؤولين`, icon: 'warning', showCancelButton: true }).then((result) => {
                if (result.isConfirmed) {
                    db.ref('admins').once('value', snapshot => {
                        const data = snapshot.val();
                        for(let key in data) { if(data[key] === idToRemove) { db.ref('admins/' + key).remove(); break; } }
                    });
                }
            });
        }

        function checkAdmin() {
            if(admins.includes(myId)) {
                document.getElementById('adminDrawer').classList.add('active');
                document.getElementById('overlay').style.display='block';
            } else { Swal.fire('Error', 'ID: ' + myId + ' (No Admin Access)', 'error'); }
        }

        function makeNewAdmin() {
            const id = document.getElementById('adminNewID').value.trim();
            if(id && !admins.includes(id)) {
                db.ref('admins').push(id).then(() => { 
                    Swal.fire('Success','تمت الإضافة','success'); 
                    document.getElementById('adminNewID').value = '';
                });
            }
        }

        function addPromoCode() {
            const code = document.getElementById('promoCode').value.trim().toUpperCase();
            const percent = parseFloat(document.getElementById('promoPercent').value);
            const max = parseFloat(document.getElementById('promoMax').value) || 0;
            const min = parseFloat(document.getElementById('promoMin').value) || 0;
            if(code && percent > 0) db.ref('promos/' + code).set({ percent, max, min }).then(() => { Swal.fire('Done', 'تم الحفظ', 'success'); });
        }

        function applyPromo() {
            const code = document.getElementById('promoInput').value.trim().toUpperCase();
            if(!code) { activePromo = null; calculateFinalTotal(); return; }
            if(promoCodes[code]) {
                const p = promoCodes[code];
                if(cartSubTotal < p.min) { Swal.fire('Error', `الحد الأدنى ${p.min} EGP`, 'error'); }
                else { activePromo = p; Swal.fire('Success', 'تم التطبيق', 'success'); }
            } else { Swal.fire('Error', 'كود خطأ', 'error'); }
            calculateFinalTotal();
        }

        function calculateFinalTotal() {
            let final = cartSubTotal; let disc = 0;
            if(activePromo) {
                disc = cartSubTotal * (activePromo.percent / 100);
                if(activePromo.max > 0 && disc > activePromo.max) disc = activePromo.max;
                final -= disc;
            }
            document.getElementById('discountRow').style.display = disc > 0 ? 'flex' : 'none';
            document.getElementById('discountPrice').innerText = `-${disc.toFixed(0)} EGP`;
            document.getElementById('totalPrice').innerText = final.toFixed(0) + " EGP";
        }

        function renderStore() {
            const container = document.getElementById('sectionsDisplay'); container.innerHTML = '';
            categories.forEach(cat => {
                const filtered = allProducts.filter(p => p.category === cat);
                if(filtered.length > 0) {
                    container.innerHTML += `<div class="section-title">ـ ${cat.toUpperCase()} ـ</div><div class="items-grid" id="grid-${cat}"></div>`;
                    filtered.forEach(p => { 
                        document.getElementById(`grid-${cat}`).innerHTML += `<div class="card" onclick="openDetail('${p.id}')"><img src="${p.i}"><div class="card-info"><b>${p.n}</b><span>${p.p} EGP</span></div></div>`; 
                    });
                }
            });
        }

        function updateCartUI() {
            let total = 0, count = 0; const itemsCont = document.getElementById('cartItems'); itemsCont.innerHTML = '';
            for(let id in cart) {
                total += (cart[id].p * cart[id].q); count += cart[id].q;
                itemsCont.innerHTML += `<div class="cart-item"><div class="cart-item-info"><b>${cart[id].n} (x${cart[id].q})</b><span>${cart[id].p * cart[id].q} EGP</span></div><i class="fa-solid fa-trash-can remove-cart-btn" onclick="removeFromCart('${id}')"></i></div>`;
            }
            cartSubTotal = total; calculateFinalTotal();
            document.getElementById('badge').innerText = count;
            document.getElementById('badge').style.display = count > 0 ? 'block' : 'none';
        }

        function openDetail(id) { 
            const p = allProducts.find(x => x.id === id); 
            document.getElementById('detName').innerText = p.n;
            document.getElementById('detPrice').innerText = p.p + " EGP";
            document.getElementById('detImg').src = p.i;
            document.getElementById('detSim').innerText = p.s || "";
            document.getElementById('addMainBtn').onclick = () => addToCart(p.id, p.n, p.p);
            document.getElementById('bigModal').style.top = '0';
        }
        function closeDetail() { document.getElementById('bigModal').style.top = '100%'; }
        function toggleCart() { document.getElementById('cartDrawer').classList.add('active'); document.getElementById('overlay').style.display='block'; }
        function closeAll() { document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('active')); document.getElementById('overlay').style.display='none'; }
        function changeQty(val) { currentQty += val; if(currentQty < 1) currentQty = 1; document.getElementById('qtyValue').innerText = currentQty; }
        function addToCart(id, n, p) { if(cart[id]) cart[id].q += currentQty; else cart[id] = {n, p, q: currentQty}; updateCartUI(); }
        function removeFromCart(id) { if(cart[id]) { cart[id].q -= 1; if(cart[id].q <= 0) delete cart[id]; updateCartUI(); } }
        function toggleLanguage() { /* تبديل اللغة */ }
        function addNewSection() { const v = document.getElementById('newSecName').value.trim().toLowerCase(); if(v && !categories.includes(v)) { categories.push(v); db.ref('categories').set(categories); } }
        function removeSection(i) { categories.splice(i, 1); db.ref('categories').set(categories); }
        function renderAdminCategories() { const c = document.getElementById('adminCats'); c.innerHTML = ''; categories.forEach((cat, i) => { c.innerHTML += `<div class="cat-tag">${cat} <i class="fa-solid fa-circle-xmark" onclick="removeSection(${i})"></i></div>`; }); }
        function renderInventory() { const inv = document.getElementById('adminInventory'); inv.innerHTML = ''; allProducts.forEach(p => { inv.innerHTML += `<div class="inv-row"><b>${p.n}</b><i class="fa-solid fa-trash" style="color:red; cursor:pointer;" onclick="db.ref('products/${p.id}').remove()"></i></div>`; }); }
        function updateAdminSelect() { const sel = document.getElementById('pCat'); sel.innerHTML = ''; categories.forEach(c => { sel.innerHTML += `<option value="${c}">${c.toUpperCase()}</option>`; }); }
        function addProduct() { const n=document.getElementById('pName').value, p=document.getElementById('pPrice').value, i=document.getElementById('pImg').value, c=document.getElementById('pCat').value; if(n && p && i) db.ref('products').push({n, p, i, category:c}); }
        function updateBanner() { const l = document.getElementById('newBanner').value; if(l) db.ref('banner').set(l); }

        load();
    </script>
</body>
</html>
